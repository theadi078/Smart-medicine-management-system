{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="empty-state py-5">
  <i class="bi bi-shield-lock"></i>
  <h4 class="fw-bold">403 — Access Denied</h4>
  <p class="text-muted">You don't have permission to view this resource.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="container py-5">
  <div class="empty-state py-5">
    <i class="bi bi-shield-lock"></i>
    <h4 class="fw-bold">403 — Access Denied</h4>
    <a href="{{ url_for('landing') }}" class="btn btn-primary">Back to Home</a>
  </div>
</div>
{% endblock %}
