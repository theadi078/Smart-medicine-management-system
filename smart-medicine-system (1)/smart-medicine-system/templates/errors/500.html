{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="empty-state py-5">
  <i class="bi bi-exclamation-octagon"></i>
  <h4 class="fw-bold">500 — Something Went Wrong</h4>
  <p class="text-muted">An unexpected error occurred. Please try again.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="container py-5">
  <div class="empty-state py-5">
    <i class="bi bi-exclamation-octagon"></i>
    <h4 class="fw-bold">500 — Something Went Wrong</h4>
    <a href="{{ url_for('landing') }}" class="btn btn-primary">Back to Home</a>
  </div>
</div>
{% endblock %}
