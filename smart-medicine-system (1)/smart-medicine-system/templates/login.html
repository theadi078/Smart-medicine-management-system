{% extends "base.html" %}
{% block title %}Log In — Smart Medicine Manager{% endblock %}
{% block guest_content %}
<div class="auth-card">
  <div class="text-center mb-4">
    <i class="bi bi-capsule-pill text-primary" style="font-size:2rem;"></i>
    <h4 class="fw-bold mt-2">Welcome back</h4>
    <p class="text-muted small">Log in to manage your medicines</p>
  </div>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ email or '' }}" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="remember" id="remember">
      <label class="form-check-label small" for="remember">Remember me</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Log In</button>
  </form>
  <p class="text-center mt-3 small text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
