{% extends "base.html" %}
{% block title %}Profile — Smart Medicine Manager{% endblock %}
{% block content %}
<h4 class="fw-bold mb-4">Profile</h4>

<div class="row g-3">
  <div class="col-lg-6">
    <div class="panel mb-3">
      <div class="panel-title">Account Information</div>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" value="{{ current_user.name }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
        </div>
        <div class="mb-3">
          <label class="form-label">Account Created</label>
          <input type="text" class="form-control" value="{{ current_user.created_at.strftime('%b %d, %Y') }}" disabled>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </form>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="panel">
      <div class="panel-title">Change Password</div>
      <form method="POST" action="{{ url_for('profile.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Current Password</label>
          <input type="password" name="current_password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" name="new_password" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary">Change Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
